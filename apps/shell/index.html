<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><link rel="manifest" href="./manifest.webmanifest"><title>Kehto Host</title></head>
  <body>
    <nav id="menu-bar" aria-label="Shell menu">
      <div class="menu-cluster">
        <button id="profile-menu-trigger" class="menu-button profile-trigger" type="button" aria-expanded="false" aria-controls="account-popover" aria-haspopup="true">
          <span class="profile-avatar" aria-hidden="true">
            <img id="profile-avatar-image" alt="" hidden>
            <span id="profile-avatar-fallback">K</span>
          </span>
          <span id="profile-menu-label">Not connected</span>
        </button>
        <div id="account-popover" class="account-popover" hidden>
          <div id="profile-actions" aria-label="Profile options">
            <button class="profile-action" type="button" data-radial-slot="0" data-stub="Profile" aria-label="Profile (coming soon)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.25"></circle><path d="M5.5 20c.5-4 2.7-6 6.5-6s6 2 6.5 6"></path></svg>
            </button>
            <button id="settings-trigger" class="profile-action" type="button" data-radial-slot="1" aria-label="Preferences" aria-expanded="false" aria-controls="settings-panel" aria-haspopup="dialog">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>
            </button>
            <button class="profile-action" type="button" data-radial-slot="2" data-stub="Help" aria-label="Help (coming soon)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M9.8 9.4a2.4 2.4 0 0 1 4.6 1c0 2-2.4 2.1-2.4 4M12 17.7v.1"></path></svg>
            </button>
            <button id="connect-account" class="profile-action" type="button" data-radial-slot="3" aria-label="Connect Nostr extension" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12h8M12 8v8M7 4.5h10a2.5 2.5 0 0 1 2.5 2.5v10a2.5 2.5 0 0 1-2.5 2.5H7A2.5 2.5 0 0 1 4.5 17V7A2.5 2.5 0 0 1 7 4.5Z"></path></svg>
            </button>
            <button id="sign-out" class="profile-action" type="button" data-radial-slot="3" aria-label="Sign out" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H5.5v14H10M14 8l4 4-4 4M8 12h10"></path></svg>
            </button>
          </div>
          <p id="account-status" class="visually-hidden" role="status" aria-live="polite">No active identity</p>
        </div>
      </div>
      <button id="spotlight-trigger" class="menu-button icon-button" type="button" aria-label="Open Napplet Spotlight" aria-expanded="false" aria-controls="spotlight-panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"></circle><path d="m15.5 15.5 4.2 4.2"></path></svg>
      </button>
    </nav>
    <div id="spotlight-panel" hidden>
      <form id="napplet-loader" role="search">
        <svg class="spotlight-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"></circle><path d="m15.5 15.5 4.2 4.2"></path></svg>
        <label class="visually-hidden" for="coordinate">Napplet coordinate</label>
        <input id="coordinate" name="coordinate" type="text" autocomplete="off" spellcheck="false" placeholder="Napplet coordinate" required>
        <button type="submit" disabled>Open Napplet</button>
        <p id="loader-status" role="status" aria-live="polite">Enter an naddr or kind:pubkey:identifier coordinate.</p>
        <span id="loader-progress" aria-hidden="true"></span>
      </form>
    </div>
    <div id="settings-panel" role="dialog" aria-modal="false" aria-labelledby="settings-title" hidden>
      <header class="settings-header">
        <h2 id="settings-title">Preferences</h2>
        <button id="settings-close" class="icon-button menu-button" type="button" aria-label="Close preferences">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"></path></svg>
        </button>
      </header>
      <div id="settings-tabs" class="settings-tabs" role="tablist" aria-label="Preference sections"></div>
      <div id="settings-body" class="settings-body"></div>
      <p id="settings-status" class="settings-status" role="status" aria-live="polite"></p>
    </div>
    <main id="app">
      <header>
        <h1>Kehto Host</h1>
        <p id="status">Starting platform…</p>
      </header>
      <section id="windows" aria-label="Napplet windows"></section>
    </main>
    <aside id="dock-shell" aria-label="Napplet launcher">
      <p id="dock-status" role="status" aria-live="polite">Loading napplets…</p>
      <nav id="napplet-dock" aria-label="Installed napplets" hidden>
        <ul id="dock-items"></ul>
      </nav>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
