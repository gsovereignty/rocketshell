<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><link rel="manifest" href="./manifest.webmanifest"><title>Kehto Host</title></head>
  <body>
    <main id="app">
      <header>
        <div><h1>Kehto Host</h1><p id="status">Starting platform…</p></div>
        <form id="napplet-loader">
          <label for="coordinate">Napplet coordinate</label>
          <div class="loader-row">
            <input id="coordinate" name="coordinate" type="text" autocomplete="off" spellcheck="false" placeholder="35129:pubkey:identifier" required>
            <button type="submit" disabled>Open Napplet</button>
          </div>
          <p id="loader-status" role="status" aria-live="polite">Enter a signed kind 35129 coordinate.</p>
        </form>
      </header>
      <section id="windows" aria-label="Napplet windows"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
